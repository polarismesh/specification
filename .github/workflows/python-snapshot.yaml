name: Snapshot-Python

on:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  check-snapshot:
    runs-on: ubuntu-latest
    outputs:
      IS_SNAPSHOT: ${{ steps.check_version.outputs.IS_SNAPSHOT }}
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install version parser
        run: python -m pip install packaging
      - name: Check Python deploy type
        id: check_version
        run: |
          python - <<'EOF'
          import os
          import re
          from pathlib import Path

          from packaging.version import Version

          about = Path("source/python/src/polarismesh_specification/__about__.py")
          match = re.search(
              r'^__version__ = ["\']([^"\']+)["\']$',
              about.read_text(),
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit(f"failed to read version from {about}")

          version = Version(match.group(1))
          is_snapshot = version.dev is not None
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"IS_SNAPSHOT={str(is_snapshot).lower()}", file=output)
          print(f"{version}: snapshot={is_snapshot}")
          EOF

  snapshot:
    runs-on: ubuntu-latest
    needs: check-snapshot
    if: ${{ needs.check-snapshot.outputs.IS_SNAPSHOT == 'true' }}
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build packaging
      # Keep the Python version independent of the Java VERSION file. The
      # checked-in version defines the target release (for example a2), while
      # the workflow run number makes every PyPI development release unique.
      - name: Set dev version from package metadata
        run: |
          python - <<'EOF'
          import os
          import re
          from pathlib import Path

          from packaging.version import Version

          about = Path("source/python/src/polarismesh_specification/__about__.py")
          text = about.read_text()
          match = re.search(
              r'^__version__ = ["\']([^"\']+)["\']$',
              text,
              re.MULTILINE,
          )
          if match is None:
              raise SystemExit(f"failed to read version from {about}")

          configured = Version(match.group(1))
          if configured.dev is None:
              raise SystemExit(f"{configured} is not a development version")

          base = str(configured).rsplit(".dev", 1)[0]
          version = str(Version(f"{base}.dev{os.environ['GITHUB_RUN_NUMBER']}"))
          updated, count = re.subn(
              r'^__version__ = ["\'][^"\']+["\']$',
              f'__version__ = "{version}"',
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if count != 1:
              raise SystemExit(f"failed to set version in {about}")
          about.write_text(updated)
          print(f"{configured} -> {version}")
          EOF
      # Run from the repository root: source/python/build.py would shadow the build module.
      - name: Build package
        run: python -m build source/python
      - name: Test installation
        run: |
          python -m pip install source/python/dist/*.whl
          python -c "from importlib.metadata import version; from polarismesh_specification.api.v1.service_manage import grpcapi_pb2_grpc; from polarismesh_specification.api.v1.skill_manage import skill_service_pb2_grpc; print(version('polarismesh-specification'))"
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: source/python/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          # A rerun keeps GITHUB_RUN_NUMBER and therefore the same version.
          skip-existing: true
